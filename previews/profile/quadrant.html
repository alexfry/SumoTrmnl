<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://usetrmnl.com/css/latest/plugins.css" />
    <script src="https://usetrmnl.com/js/latest/plugins.js"></script>

    <!-- Begin Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- End Inter font -->
  </head>
  <body class="environment trmnl">
    <div class="screen">
      <div class="view view--quadrant">
        <style>
  .layout { padding: 0 !important; margin: 0 !important; }
  .view { padding: 0 !important; }
</style>

<div style="display: flex; flex-direction: row; width: 400px; height: 240px; overflow: hidden;">

  <div style="width: 140px; flex-shrink: 0; overflow: hidden;">
    
      <img class="image image-dither image--cover"
           src="https://alexfry.github.io/SumoTrmnl/photos/12226.png"
           style="display: block; width: 140px; height: 240px; object-fit: cover; object-position: top;">
    
  </div>

  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 10px 12px 10px 14px; gap: 0;">

    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin-bottom: 8px;">
      
        <img class="image image-dither"
             src="https://alexfry.github.io/SumoTrmnl/jp/2c88e9afcd6b.png"
             style="display: block; height: 24px;">
      
      <span class="title" style="font-size: 20px; line-height: 1;">Kazuma</span>
    </div>

    <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 4px;">
      <div><span class="label label--small">Rank</span>&nbsp;<span class="label" style="font-weight: bold;">M15w</span></div>
      <div><span class="label label--small">Peak</span>&nbsp;<span class="label">M15w</span></div>
    </div>

    <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px;">
      
        <div><span class="label label--small">Age</span>&nbsp;<span class="label">24</span></div>
      
      
        <div><span class="label label--small">Height</span>&nbsp;<span class="label">185.0cm</span></div>
      
    </div>

    <div style="margin-bottom: 6px;">
      <span class="title value--tnums" style="font-size: 16px;">66W &ndash; 27L &ndash; 16A</span>
      <div><span class="label label--small">13 basho · 4 Yusho · 0 Prizes</span></div>
    </div>

    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
      
        <div><span class="label label--small">Stable</span>&nbsp;<span class="label">Kise</span></div>
      
      
        <div><span class="label label--small">From</span>&nbsp;<span class="label">Ishikawa</span></div>
      
    </div>

  </div>

</div>

<script>terminalize()</script>

      </div>
    </div>
  </body>
</html>
