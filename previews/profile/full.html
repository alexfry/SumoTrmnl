<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://usetrmnl.com/css/latest/plugins.css" />
    <script src="https://usetrmnl.com/js/latest/plugins.js"></script>

    <!-- Begin Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- End Inter font -->
  </head>
  <body class="environment trmnl">
    <div class="screen">
      <div class="view view--full">
        <style>
  .layout { padding: 0 !important; margin: 0 !important; }
  .view { padding: 0 !important; }
  .stat-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1px solid currentColor;
    border-radius: 6px;
    padding: 6px 10px;
    flex: 1;
  }
</style>

<div style="display: flex; flex-direction: row; width: 800px; height: 480px; overflow: hidden;">

  <!-- Photo -->
  <div style="width: 210px; flex-shrink: 0; overflow: hidden;">
    
      <img class="image image-dither image--cover"
           src="https://alexfry.github.io/SumoTrmnl/photos/12226.png"
           style="display: block; width: 210px; height: 480px; object-fit: cover; object-position: top;">
    
  </div>

  <!-- Info panel -->
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 20px 20px 16px 24px; gap: 0;">

    <!-- Name -->
    <div style="display: flex; align-items: flex-end; gap: 12px; margin-bottom: 12px;">
      
        <img class="image image-dither"
             src="https://alexfry.github.io/SumoTrmnl/jp/2c88e9afcd6b.png"
             style="display: inline; height: 48px; vertical-align: bottom;">
      
      <span class="title" style="font-size: 28px; line-height: 1;">Kazuma</span>
    </div>

    <!-- Rank / Stable / From -->
    <div style="display: flex; gap: 20px; margin-bottom: 8px; flex-wrap: wrap;">
      <div><span class="label label--small">Rank</span>&nbsp;<span class="label" style="font-weight: bold;">M15w</span></div>
      <div><span class="label label--small">Peak</span>&nbsp;<span class="label">M15w</span></div>
      
        <div><span class="label label--small">Stable</span>&nbsp;<span class="label">Kise</span></div>
      
      
        <div><span class="label label--small">From</span>&nbsp;<span class="label">Ishikawa</span></div>
      
    </div>

    <!-- Physical -->
    <div style="display: flex; gap: 20px; margin-bottom: 16px;">
      
        <div><span class="label label--small">Age</span>&nbsp;<span class="label">24</span></div>
      
      
        <div><span class="label label--small">Height</span>&nbsp;<span class="label">185.0cm</span></div>
      
      
        <div><span class="label label--small">Weight</span>&nbsp;<span class="label">205.0kg</span></div>
      
    </div>

    <!-- Divider -->
    <hr style="border: none; border-top: 1px solid currentColor; margin-bottom: 16px;">

    <!-- Career stat boxes -->
    <div style="display: flex; gap: 8px; margin-bottom: 14px;">
      <div class="stat-box" style="flex: 2.5;">
        <span class="title value--tnums" style="font-size: 18px;">66W &ndash; 27L &ndash; 16A</span>
        <span class="label label--small">13 basho career</span>
      </div>
      <div class="stat-box">
        <span class="title value--tnums">4</span>
        <span class="label label--small">Yusho</span>
      </div>
      <div class="stat-box">
        <span class="title value--tnums">0</span>
        <span class="label label--small">Jun-Yusho</span>
      </div>
      <div class="stat-box">
        <span class="title value--tnums">0</span>
        <span class="label label--small">Prizes</span>
      </div>
    </div>

    <!-- Timeline -->
    <div style="display: flex; gap: 20px; margin-bottom: 8px;">
      
        <div><span class="label label--small">Debut</span>&nbsp;<span class="label label--small">2024-07</span></div>
      
      <div><span class="label label--small">Status</span>&nbsp;<span class="label label--small">Active</span></div>
    </div>

    <!-- Description -->
    
      <p class="label label--small" style="margin: 0; line-height: 1.45; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">Makuuchi wrestler from Ishikawa, Kise-beya.</p>
    

  </div>

</div>

<script>terminalize()</script>

      </div>
    </div>
  </body>
</html>
